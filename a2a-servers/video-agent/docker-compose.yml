version: '3.8'

services:
  video-agent:
    build: .
    ports:
      - "8001:8001"
    environment:
      - BASE_URL=http://localhost:8001
      - API_KEY=test_api_key_123
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
