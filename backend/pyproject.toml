[project]
name = "ai-agency"
version = "0.1.0"
description = "AI Agency - Multi-agent creative campaign system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.38.0",
    "websockets>=12.0",
    "redis>=7.0.1",
    "celery>=5.3.6",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.0",
    # Google AI SDKs
    "google-genai>=1.47.0",  # Unified SDK for Gemini, Imagen, Veo (Oct 2025)
    "google-adk>=1.17.0",  # Agent Development Kit for simplified streaming (Oct 2025)
    "google-cloud-aiplatform>=1.125.0",  # Vertex AI for Agent Engine and Memory Bank
    "google-cloud-texttospeech>=2.14.0",  # TTS for Lyria
    "google-cloud-speech>=2.20.0",  # STT for Chirp
    # HTTP client and image processing
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    # Audio processing
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "numpy>=1.26.3",
    # Cloud storage
    "google-cloud-storage>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.21.0",
    "black>=24.1.1",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
