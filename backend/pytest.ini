[pytest]
# Pytest configuration for AI Agency backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests with mocked dependencies (fast)
    integration: Integration tests with real API calls (slow, requires credentials)
    slow: Slow tests (>10 seconds)
    asyncio: Async tests

# Asyncio mode
asyncio_mode = auto

# Console output
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Ignore directories
norecursedirs = .git .tox dist build *.egg __pycache__

# Coverage settings (optional)
# [coverage:run]
# source = app
# omit = */tests/*

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
