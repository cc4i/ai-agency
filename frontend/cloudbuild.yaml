# Cloud Build configuration for automated frontend deployments
steps:
  # Build the container image with build args
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-agency-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-agency-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_WS_URL=${_WS_URL}'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'frontend'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-agency-frontend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-agency-frontend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-agency-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-agency-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600s'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_BACKEND_URL=${_BACKEND_URL}'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_WS_URL=${_WS_URL}'

substitutions:
  _BACKEND_URL: 'https://ai-agency-backend-xxxx.run.app'  # Update this
  _WS_URL: 'wss://ai-agency-backend-xxxx.run.app'  # Update this

images:
  - 'gcr.io/$PROJECT_ID/ai-agency-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ai-agency-frontend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
